<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisKey | Enterprise Login</title>
    <style>
        :root {
            --bg-main: #0B0F17;
            --bg-surface: #161F30;
            --border-color: #23314D;
            --accent-primary: #0071E3;
            --accent-hover: #005bb5;
            --accent-cyan: #00F2FE;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --color-error: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .brand-container {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.15) 0%, rgba(11, 15, 23, 0.9) 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .brand-box {
            text-align: center;
            max-width: 320px;
        }

        .brand-logo {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.25));
        }

        .brand-tagline {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .login-card {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-header {
            margin-bottom: 30px;
        }

        .mobile-logo {
            display: none;
            max-width: 160px;
            margin-bottom: 15px;
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .link-muted {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .link-muted:hover {
            color: var(--accent-cyan);
        }

        .link-accent {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .link-accent:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-error {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--color-error);
            color: var(--color-error);
            font-size: 0.85rem;
            text-align: center;
        }

        .form-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        @media (max-width: 850px) {
            .brand-container {
                display: none;
            }
            .mobile-logo {
                display: block;
            }
            .login-card {
                padding: 35px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Side: Brand Logo & Graphics -->
        <div class="brand-container">
            <div class="brand-box">
                <img src="original-image.svg" alt="AegisKey Logo" class="brand-logo">
                <p class="brand-tagline">Enterprise Steganographic Vault & Forensic Protection System</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="login-card">
            <div class="card-header">
                <img class="mobile-logo" src="original-image.svg" alt="AegisKey">
                <h2>Welcome Back</h2>
                <p>Enter your credentials to access the secure vault</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Work Email Address</label>
                    <input class="input-field" type="email" id="email" placeholder="enter your email.." required>
                </div>

                <div class="input-group">
                    <label for="password">Master Password</label>
                    <input class="input-field" type="password" id="password" placeholder="enter your Password" required>
                </div>

                <div class="form-actions">
                    <a href="forgot.html" class="link-muted">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Login</button>
                
                <div id="errorAlert" class="alert-error" style="display: none;"></div>

                <div class="form-footer">
                    <span>Don't have an account?</span>
                    <a href="Sign.html" class="link-accent">Create account</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('errorAlert');

            btn.innerText = "Authenticating...";
            btn.disabled = true;
            alertBox.style.display = 'none';

            try {
                // Node.js Express Backend API call
                const response = await fetch('/api/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const result = await response.json();

                if (result.success) {
                    // Session localStorage mein store karna aur index.html par redirect karna
                    localStorage.setItem('aegis_session', JSON.stringify(result.user || { email }));
                    window.location.href = 'index.html';
                } else {
                    alertBox.innerText = result.error || "Incorrect email or password!";
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.innerText = "Server connection failed! Ensure Node.js server is running.";
                alertBox.style.display = 'block';
            } finally {
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
