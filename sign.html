<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisKey | Create Account</title>
    <style>
        :root {
            --bg-main: #0B0F17;
            --bg-surface: #161F30;
            --border-color: #23314D;
            --accent-primary: #0071E3;
            --accent-hover: #005bb5;
            --accent-cyan: #00F2FE;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --color-error: #EF4444;
            --color-success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .brand-container {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.15) 0%, rgba(11, 15, 23, 0.9) 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .brand-box {
            text-align: center;
            max-width: 320px;
        }

        .brand-logo {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.25));
        }

        .brand-tagline {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .signup-card {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .card-header {
            margin-bottom: 25px;
        }

        .mobile-logo {
            display: none;
            max-width: 160px;
            margin-bottom: 15px;
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .select-field option {
            background-color: var(--bg-surface);
            color: var(--text-main);
        }

        .input-field:focus, .select-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--color-error);
            color: var(--color-error);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .link-accent {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .link-accent:hover {
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .brand-container {
                display: none;
            }
            .mobile-logo {
                display: block;
            }
            .signup-card {
                padding: 30px 20px;
                max-height: none;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .input-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Side: Brand Logo -->
        <div class="brand-container">
            <div class="brand-box">
                <img src="original-image.svg" alt="AegisKey Logo" class="brand-logo">
                <p class="brand-tagline">Initialize your Secure Steganographic Account & Access Controls</p>
            </div>
        </div>

        <!-- Right Side: Registration Form -->
        <div class="signup-card">
            <div class="card-header">
                <img class="mobile-logo" src="original-image.svg" alt="AegisKey">
                <h2>Create Account</h2>
                <p>Set up your encrypted vault credentials</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-grid">
                    
                    <!-- Email Field -->
                    <div class="input-group full-width">
                        <label for="email">Work / Personal Email</label>
                        <input class="input-field" type="email" id="email" placeholder="enter your email.." required>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password">Master Password</label>
                        <input class="input-field" type="password" id="password" placeholder="enter password" required>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input class="input-field" type="password" id="confirmPassword" placeholder="confirm password" required>
                    </div>

                    <!-- Purpose Selection (10 Options) -->
                    <div class="input-group full-width">
                        <label for="purpose">Primary Usage Purpose</label>
                        <select class="select-field" id="purpose" required>
                            <option value="" disabled selected>Select your purpose...</option>
                            <option value="Personal Vault & Media Privacy">1. Personal Vault & Media Privacy</option>
                            <option value="Cybersecurity / Ethical Hacking">2. Cybersecurity / Ethical Hacking</option>
                            <option value="Corporate Data Loss Prevention (DLP)">3. Corporate Data Loss Prevention (DLP)</option>
                            <option value="Journalism & Confidential Communication">4. Journalism & Confidential Source Protection</option>
                            <option value="Digital Forensics & Incident Response">5. Digital Forensics & Leak Tracking</option>
                            <option value="Medical / Healthcare Records Security">6. Sensitive Medical & Patient Records Storage</option>
                            <option value="Legal & Financial Document Protection">7. Legal & Financial Document Security</option>
                            <option value="Software Development & Key Management">8. Software Development & Secrets Protection</option>
                            <option value="Academic & Security Research">9. Academic & Cryptographic Research</option>
                            <option value="Military & Enterprise Security Operations">10. High-Security Enterprise Operations</option>
                        </select>
                    </div>

                    <!-- Country Selection -->
                    <div class="input-group full-width">
                        <label for="country">Country / Region</label>
                        <select class="select-field" id="country" required>
                            <option value="" disabled selected>Select your country...</option>
                            <option value="India">India</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Japan">Japan</option>
                            <option value="Singapore">Singapore</option>
                            <option value="United Arab Emirates">United Arab Emirates</option>
                            <option value="Brazil">Brazil</option>
                            <option value="Russian Federation">Russian Federation</option>
                            <option value="South Korea">South Korea</option>
                            <option value="Netherlands">Netherlands</option>
                            <option value="Switzerland">Switzerland</option>
                            <option value="Saudi Arabia">Saudi Arabia</option>
                            <option value="South Africa">South Africa</option>
                            <option value="Mexico">Mexico</option>
                            <option value="Other Country">Other Country</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn-primary" id="signupBtn">Initialize Account</button>
                
                <div id="alertBox" class="alert-box"></div>

                <div class="form-footer">
                    <span>Already have an account?</span>
                    <a href="login.html" class="link-accent">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const purpose = document.getElementById('purpose').value;
            const country = document.getElementById('country').value;
            
            const btn = document.getElementById('signupBtn');
            const alertBox = document.getElementById('alertBox');

            // Password Match Check
            if (password !== confirmPassword) {
                showAlert("Passwords do not match!", "error");
                return;
            }

            btn.innerText = "Creating Account...";
            btn.disabled = true;
            alertBox.style.display = 'none';

            try {
                // Node.js Express Server API Endpoint
                const response = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        password: password, 
                        purpose: purpose, 
                        country: country 
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert("Account created successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    showAlert(result.error || "Registration failed! Email might already exist.", "error");
                    btn.innerText = "Initialize Account";
                    btn.disabled = false;
                }
            } catch (err) {
                showAlert("Server connection failed! Ensure Node.js server is running.", "error");
                btn.innerText = "Initialize Account";
                btn.disabled = false;
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
